name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Decide whether the slow Python job is needed. It is skipped only for pull requests whose
  # changed files are ALL under practice-studio/ (or docs/studio_design.md) and that delete or rename nothing (pytest
  # checks that some Studio files exist). Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      prg: ${{ steps.detect.outputs.prg }}
      lab: ${{ steps.detect.outputs.lab }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "prg=true" >> "$GITHUB_OUTPUT"
            echo "lab=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base"..."$head")
          removed=$(git diff --name-only --diff-filter=DR "$base"..."$head")
          echo "Changed files:"; echo "$changed"
          # PRG tests (ESLint/tsc heavy) run only when PRG code/content, migration, or shared infra/originality changes.
          if [ -n "$removed" ] || echo "$changed" | grep -qE '^(code_engine/|labs/|tools/lint/|drills/data/PRG|rules/04|tests/test_(new_code_drill|prg_|new_project|ai_code_ingest|lab_ingest)|tests/test_unit_scope\.py|tests/conftest\.py|pytest\.ini|requirements|quality_rules\.py|progress_store\.py|notion_sync/|scripts/(review_record|prg_migrate)\.py|docs/prg_(migration_map|v1_codes)\.json|math_engine/source_cores/(__init__|originality|code_originality)\.py|\.github/)'; then
            echo "prg=true" >> "$GITHUB_OUTPUT"
          else
            echo "prg=false" >> "$GITHUB_OUTPUT"
            echo "No PRG paths changed: skipping the PRG test job."
          fi
          # Lab reference checks run when labs, shared lint/test tooling, or workflow config change.
          if [ -n "$removed" ] || echo "$changed" | grep -qE '^(labs/|tools/lint/|\.github/)'; then
            echo "lab=true" >> "$GITHUB_OUTPUT"
          else
            echo "lab=false" >> "$GITHUB_OUTPUT"
            echo "No lab/lint paths changed: skipping the lab job."
          fi
          # docs/studio_design.md is the Studio design guide; pytest never reads it.
          # Studio contract files read by Python parity tests (test_drill_schema.py, test_figures_everywhere.py) still trigger python.
          if [ -n "$removed" ] \
            || echo "$changed" | grep -Ev '^(practice-studio/|docs/studio_design\.md$)' | grep -q . \
            || echo "$changed" | grep -qE '^practice-studio/src/(types/.*\.ts|lib/redact\.ts|components/MathFigure/(GeometryRenderer|CartesianRenderer)\.tsx)$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "Studio-only change: skipping the Python job."
          fi
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: tools/lint
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m scripts.doc_refs
      - run: python -m pytest -n auto -m "not prg"
      - run: python -m code_engine.quality_checks --check-vaults
  doc-map:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.doc_refs --changed "origin/${{ github.base_ref }}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
  prg:
    needs: changes
    if: needs.changes.outputs.prg == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: tools/lint
      - run: python -m pytest -n auto -m prg
      - run: python -m code_engine.lint_check --all
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: practice-studio/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:telemetry
  lab:
    needs: changes
    if: needs.changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: npm ci
        working-directory: tools/lint
      - name: Run reference checks for all labs
        run: |
          rc=0
          count=0
          for dir in labs/LAB-*/; do
            [ -d "$dir" ] || continue
            count=$((count + 1))
            echo "=== Checking $dir ==="
            (cd "$dir" && npm run check:reference) || rc=1
          done
          test "$count" -gt 0
          exit "$rc"
