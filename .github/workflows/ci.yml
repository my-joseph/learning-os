name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Decide whether the slow Python job is needed. It is skipped only for pull requests whose
  # changed files are ALL under practice-studio/ and that delete or rename nothing (pytest
  # checks that some Studio files exist). Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base"..."$head")
          removed=$(git diff --name-only --diff-filter=DR "$base"..."$head")
          echo "Changed files:"; echo "$changed"
          if [ -n "$removed" ] || echo "$changed" | grep -qv '^practice-studio/'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "Studio-only change: skipping the Python job."
          fi
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: tools/lint
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m code_engine.lint_check --all
      - run: python -m code_engine.quality_checks --check-vaults
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: practice-studio/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:telemetry
  lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/LAB-PRG-T01-C04-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: npm ci
        working-directory: tools/lint
      - run: npm run check:reference
